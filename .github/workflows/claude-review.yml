# Reusable (G5): Claude reviews the PR (call it on trusted PRs only: it is not hardened against prompt injection) for real bugs, following the repo's "Review rules"
# (CLAUDE.md or AGENTS.md). The caller passes CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`)
# and grants: contents: read, pull-requests: write, id-token: write.
name: claude-review
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for real bugs, not style. First read CLAUDE.md or AGENTS.md and apply
            its "Review rules" section. Look beyond the diff: callers of changed functions and sibling code
            paths that share the logic. For every changed entry point ask: wrong user? no user? expired or
            forged credentials? input at limit-1 / limit / limit+1 through every write path? two requests at
            once? failure halfway (orphans, half-saved state)? stale cache? user-supplied URL or path fetched?
            Also flag a behaviour change or bug fix that comes without a test.
            Post each finding as an inline comment with the concrete failing scenario. Finish with one short
            summary comment; say plainly if you found nothing.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
