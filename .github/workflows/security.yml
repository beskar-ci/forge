# Reusable (G5, and G0's "no secret in the history"): gitleaks over the WHOLE git history, plus dependency audits
# for whatever ecosystems the caller repo uses.
# Call with:  uses: beskar-ci/forge/.github/workflows/security.yml@<sha>
name: security
on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI itself (MIT, no licence key; the gitleaks Action needs one for organisation repos),
      # pinned by digest. Scans every commit, no baseline. False positives: the caller's .gitleaks.toml,
      # edited by a human only (see templates/.gitleaks.toml). Findings are redacted in the log.
      - run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --redact --verbose --exit-code 1

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: npx -y pnpm@9.15.9 audit --audit-level high
      - if: hashFiles('Cargo.lock') != ''
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit
      # Unmaintained-crate warnings are reported but do not fail; vulnerabilities do.
      - if: hashFiles('Cargo.lock') != ''
        run: cargo audit
      # ponytail: requirements.txt only; add uv.lock / poetry.lock when a project needs it.
      - if: hashFiles('requirements.txt') != ''
        run: pipx run pip-audit -r requirements.txt
